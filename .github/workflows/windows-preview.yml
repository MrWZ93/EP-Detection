name: Windows build candidate (manual, not a validated release)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.in
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m PyInstaller --noconfirm EPDesktop.spec
      - run: '& "dist/EP Desktop/EP Desktop.exe" --self-test'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-GUI-unverified
          path: dist/EP Desktop/
